<article class="product-card" data-product-id="{{id}}" data-product-category="{{category}}"><a class="product-card__image" href="{{productHref}}"><img src="{{image}}" alt="{{title}}" loading="lazy"><span>{{badge}}</span></a><div class="product-card__meta"><div><h3><a href="{{productHref}}">{{title}}</a></h3><p>{{category}}</p></div><strong>{{priceLabel}}</strong></div><button type="button" class="product-card__add" data-add-to-cart="{{id}}">{{addLabel}}</button></article>
