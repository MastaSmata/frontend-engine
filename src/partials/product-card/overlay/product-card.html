<article class="overlay-card" data-product-id="{{id}}" data-product-category="{{category}}"><a class="overlay-card__media" href="{{productHref}}"><img src="{{image}}" alt="{{title}}" loading="lazy">{{#badge}}<span class="overlay-card__badge">{{badge}}</span>{{/badge}}<span class="overlay-card__view">View piece ↗</span></a><div class="overlay-card__info"><div><span>{{category}}</span><h3><a href="{{productHref}}">{{title}}</a></h3><strong>{{priceLabel}}</strong></div><button type="button" data-add-to-cart="{{id}}" aria-label="Add {{title}} to bag">{{addLabel}}</button></div></article>
