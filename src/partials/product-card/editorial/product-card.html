<article class="product-card" data-product-id="{{id}}" data-product-category="{{category}}">
  <a class="product-card__media" href="{{productHref}}"><img src="{{image}}" alt="{{title}}" loading="lazy"><span>{{badge}}</span></a>
  <div class="product-card__info"><div><span class="product-card__category">{{category}}</span><h3><a href="{{productHref}}">{{title}}</a></h3><p>{{priceLabel}}</p></div><button type="button" data-add-to-cart="{{id}}" aria-label="Add {{title}} to bag">Add</button></div>
</article>
