<section class="hero">
  <div class="hero__copy"><span class="hero__eyebrow">{{eyebrow}}</span><h1>{{title}} {{emphasis}}</h1><p>{{description}}</p>{{#buttonLabel}}<a class="hero__button" href="{{buttonHref}}">{{buttonLabel}} <span aria-hidden="true">↗</span></a>{{/buttonLabel}}</div>
  <div class="hero__media">{{#image}}<img src="{{image}}" alt="{{imageAlt}}" fetchpriority="high">{{/image}}{{^image}}<div class="hero__placeholder" aria-hidden="true"></div>{{/image}}</div>
</section>
