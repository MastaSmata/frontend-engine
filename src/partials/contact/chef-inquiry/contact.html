<section id="{{id}}" class="chef-inquiry"><div class="chef-inquiry__intro"><p>{{eyebrow}}</p><h2>{{title}}</h2><div>{{description}}</div><a href="mailto:{{email}}">{{email}}</a>{{#phone}}<a href="tel:{{phone}}">{{phone}}</a>{{/phone}}</div><form class="chef-inquiry__form" data-contact-form><label>Your name<input name="name" autocomplete="name" required></label><label>Email address<input name="email" type="email" autocomplete="email" required></label><label>Tell us about your occasion<textarea name="message" rows="5" required></textarea></label><button type="submit">{{buttonLabel}} <span aria-hidden="true">↗</span></button></form></section>
