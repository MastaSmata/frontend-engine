<section class="contact"><div class="contact__intro"><span>{{eyebrow}}</span><h1>{{title}}</h1><p>{{description}}</p><a href="mailto:{{email}}">{{email}}</a></div><form class="contact__form" data-contact-form><label>Name<input name="name" autocomplete="name" required></label><label>Email<input name="email" type="email" autocomplete="email" required></label><label>Message<textarea name="message" rows="5" required></textarea></label><button type="submit">{{buttonLabel}}</button></form></section>
